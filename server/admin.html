<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tilbi coupon admin</title>
  <style>
    :root {
      --bg: #1e293b;
      --panel: #0f172a;
      --line: rgba(148, 163, 184, 0.25);
      --text: #f8fafc;
      --muted: #94a3b8;
      --blue: #4a86e8;
      --green: #86efac;
      --red: #fca5a5;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Segoe UI, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px;
    }
    h1 { margin: 0 0 6px; font-size: 22px; }
    .sub { color: var(--muted); margin: 0 0 20px; font-size: 13px; }
    .stats { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
    .stat {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px 16px;
      min-width: 140px;
    }
    .stat b { display: block; font-size: 24px; }
    .stat span { color: var(--muted); font-size: 12px; }
    .toolbar, .login, .generate {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 14px;
    }
    input, select, button {
      border-radius: 6px;
      border: 1px solid var(--line);
      background: #0b1220;
      color: var(--text);
      padding: 8px 10px;
      font-size: 13px;
    }
    button {
      background: var(--blue);
      border-color: #3b78e7;
      cursor: pointer;
      font-weight: 600;
    }
    button.secondary { background: #334155; border-color: #475569; }
    table { width: 100%; border-collapse: collapse; background: var(--panel); border-radius: 10px; overflow: hidden; }
    th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); font-size: 13px; }
    th { color: var(--muted); font-weight: 600; }
    code { font-family: Consolas, monospace; }
    .ok { color: var(--green); }
    .dead { color: var(--red); }
    .msg { min-height: 18px; font-size: 13px; color: var(--muted); margin-bottom: 10px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <h1>Globinner · Tilbi coupons</h1>
  <p class="sub">Owner only on this PC. Not shown to Tilbi users.</p>
  <div class="msg" id="msg"></div>

  <div id="app" class="hidden">
    <div class="stats">
      <div class="stat"><b id="unused">0</b><span>Unused</span></div>
      <div class="stat"><b id="used">0</b><span>Used up</span></div>
      <div class="stat"><b id="total">0</b><span>Total codes</span></div>
    </div>
    <div class="toolbar">
      <select id="filter">
        <option value="unused">Unused only</option>
        <option value="all">All</option>
        <option value="used">Used up</option>
      </select>
      <button type="button" id="refresh" class="secondary">Refresh</button>
      <button type="button" id="copy">Copy unused codes</button>
    </div>
    <div class="generate">
      <select id="months">
        <option value="1">1 month</option>
        <option value="3">3 months</option>
        <option value="6">6 months</option>
        <option value="12">1 year</option>
      </select>
      <input id="count" type="number" min="1" max="50" value="5">
      <button type="button" id="create">Generate</button>
    </div>
    <table>
      <thead>
        <tr>
          <th>Code</th>
          <th>Duration</th>
          <th>Used</th>
          <th>Left</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <script>
    const msg = document.getElementById('msg');
    let coupons = [];

    async function api(path, options) {
      const res = await fetch(path, {
        ...options,
        headers: {
          'Content-Type': 'application/json',
          ...(options && options.headers)
        }
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
      return data;
    }

    function render() {
      const filter = document.getElementById('filter').value;
      const unused = coupons.filter((c) => c.remaining > 0);
      const used = coupons.filter((c) => c.remaining <= 0);
      document.getElementById('unused').textContent = unused.length;
      document.getElementById('used').textContent = used.length;
      document.getElementById('total').textContent = coupons.length;
      const list = filter === 'unused' ? unused : (filter === 'used' ? used : coupons);
      document.getElementById('rows').innerHTML = list.map((c) => (
        '<tr>' +
          '<td><code>' + c.code + '</code></td>' +
          '<td>' + c.label + '</td>' +
          '<td>' + c.redemptionCount + '/' + c.maxRedemptions + '</td>' +
          '<td>' + c.remaining + '</td>' +
          '<td class="' + (c.remaining > 0 ? 'ok' : 'dead') + '">' + (c.remaining > 0 ? 'Available' : 'Used') + '</td>' +
        '</tr>'
      )).join('') || '<tr><td colspan="5">No coupons in this view.</td></tr>';
    }

    async function load() {
      const data = await api('/api/admin/coupons');
      coupons = data.coupons || [];
      document.getElementById('app').classList.remove('hidden');
      render();
    }

    document.getElementById('refresh').onclick = () => load().catch((err) => { msg.textContent = err.message; });
    document.getElementById('filter').onchange = render;
    document.getElementById('copy').onclick = async () => {
      const unused = coupons.filter((c) => c.remaining > 0).map((c) => c.code).join('\n');
      await navigator.clipboard.writeText(unused);
      msg.style.color = '#86efac';
      msg.textContent = 'Copied ' + (unused ? unused.split('\n').length : 0) + ' unused code(s).';
    };
    document.getElementById('create').onclick = async () => {
      try {
        const data = await api('/api/admin/coupons', {
          method: 'POST',
          body: JSON.stringify({
            durationMonths: Number(document.getElementById('months').value),
            count: Number(document.getElementById('count').value),
            maxRedemptions: 1
          })
        });
        msg.style.color = '#86efac';
        msg.textContent = 'Created ' + (data.coupons || []).length + ' code(s).';
        await load();
      } catch (err) {
        msg.style.color = '#fca5a5';
        msg.textContent = err.message;
      }
    };

    load().catch((err) => {
      msg.style.color = '#fca5a5';
      msg.textContent = err.message;
    });
  </script>
</body>
</html>
