<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Select Video Recording Area</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      cursor: crosshair;
      user-select: none;
    }

    #overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.3);
    }

    #selection {
      position: absolute;
      border: 2px solid #4a86e8;
      background: rgba(74, 134, 232, 0.1);
      display: none;
      pointer-events: none;
      z-index: 2147483647; /* ensure it's always visible */
      box-shadow: 0 0 0 1px rgba(0,0,0,0.2), 0 0 8px rgba(255, 68, 68, 0.6);
    }



    .selection-guide {
      position: fixed;
      background: rgba(255, 255, 255, 0.9);
      padding: 8px 12px;
      border-radius: 6px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      color: #333;
      pointer-events: none;
      border: 1px solid #ddd;
      z-index: 2147483647;
    }

    .video-indicator {
      position: absolute;
      top: -25px;
      left: -2px;
      background: #4a86e8;
      color: white;
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 10px;
      font-weight: bold;
    }

  </style>
</head>
<body>
  <div id="overlay"></div>
  <div id="selection">
    <div class="video-indicator">VIDEO</div>
  </div>
  <div class="selection-guide">Click and drag to select area for video recording</div>

  <script>
    const { ipcRenderer } = require('electron');
    
    const overlay = document.getElementById('overlay');
    const selection = document.getElementById('selection');
    const guide = document.querySelector('.selection-guide');
    
    let isDrawing = false;
    let startX, startY;

    function updateGuidePosition(e) {
      guide.style.left = (e.clientX + 15) + 'px';
      guide.style.top = (e.clientY + 15) + 'px';
    }

    function updateSelectionBox(e) {
      const currentX = e.clientX;
      const currentY = e.clientY;
      
      const width = Math.abs(currentX - startX);
      const height = Math.abs(currentY - startY);
      
      const left = Math.min(startX, currentX);
      const top = Math.min(startY, currentY);
      
      selection.style.left = left + 'px';
      selection.style.top = top + 'px';
      selection.style.width = width + 'px';
      selection.style.height = height + 'px';
      
      guide.textContent = `${width} × ${height} - Release to start video recording`;
    }

    function handleMouseDown(e) {
      isDrawing = true;
      startX = e.clientX;
      startY = e.clientY;
      selection.style.display = 'block';
      selection.style.width = '0';
      selection.style.height = '0';
      selection.style.left = startX + 'px';
      selection.style.top = startY + 'px';
      guide.textContent = 'Drag to select area...';
    }

    function handleMouseMove(e) {
      updateGuidePosition(e);
      if (isDrawing) {
        updateSelectionBox(e);
        e.preventDefault();
      }
    }

    function handleMouseUp(e) {
      if (!isDrawing) return;
      
      isDrawing = false;
      const bounds = selection.getBoundingClientRect();
      
             // Only proceed if the selection has a valid size
      if (bounds.width > 10 && bounds.height > 10) {
        // Keep the selected area visible until recording stops
        overlay.style.background = 'transparent';
        selection.style.display = 'block';
        selection.style.border = 'none';
        selection.style.backgroundColor = 'transparent';
        selection.style.boxShadow = '0 0 0 2px #ff4444'; // outline OUTSIDE crop
        guide.style.display = 'block';
        guide.textContent = 'Recording this area...';
        
        // Use the bounds directly - they are already in the correct coordinate system
        // The video element will get the full screen stream, so we crop from that
        const selectionBounds = {
          x: Math.round(bounds.x),
          y: Math.round(bounds.y),
          width: Math.round(bounds.width),
          height: Math.round(bounds.height),
          shape: 'rect'
        };
        
        console.log('Selection bounds:', selectionBounds);
        
        // Send the selected area bounds to start video recording
        ipcRenderer.send('start-video-recording-area', selectionBounds);
      } else {
       // If selection is too small, cancel it
       ipcRenderer.send('cancel-video-selection');
     }
    }

    // Add event listeners to document instead of overlay
    document.addEventListener('mousedown', handleMouseDown);
    document.addEventListener('mousemove', handleMouseMove);
    document.addEventListener('mouseup', handleMouseUp);



    // Handle mouse leaving the window
    document.addEventListener('mouseleave', () => {
      if (isDrawing) {
        isDrawing = false;
        ipcRenderer.send('cancel-video-selection');
      }
    });

    // Cancel selection with Escape key
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        ipcRenderer.send('cancel-video-selection');
      }
    });

    // Prevent text selection and context menu
    document.addEventListener('selectstart', e => e.preventDefault());
    document.addEventListener('contextmenu', e => e.preventDefault());

    // Handle locking selection during recording
    ipcRenderer.on('lock-selection', (event, bounds) => {
      // Remove dark overlay background
      overlay.style.background = 'transparent';
      
      // Show the locked selection with just border, no background
      selection.style.display = 'block';
      selection.style.left = bounds.x + 'px';
      selection.style.top = bounds.y + 'px';
      selection.style.width = bounds.width + 'px';
      selection.style.height = bounds.height + 'px';
      selection.style.border = 'none';
      selection.style.backgroundColor = 'transparent';
      selection.style.boxShadow = '0 0 0 2px #ff4444'; // outline OUTSIDE crop
      
      // Update guide text
      guide.style.display = 'block';
      guide.style.left = (bounds.x + bounds.width + 10) + 'px';
      guide.style.top = bounds.y + 'px';
      guide.textContent = 'Recording this area...';
      guide.style.backgroundColor = 'rgba(255, 68, 68, 0.8)';
      guide.style.color = 'white';
    });

    // Hide outline when recording stops
    ipcRenderer.on('stop-recording-command', () => {
      try {
        selection.style.display = 'none';
        guide.style.display = 'none';
        overlay.style.background = 'rgba(0,0,0,0.3)';
      } catch (_) {}
    });
    
  </script>
</body>
</html>
